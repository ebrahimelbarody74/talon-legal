<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TALON AI — Legal</title>
<style>
  :root{--bg:#060409;--card:#0f0a17;--line:#241a33;--text:#ece7f5;--muted:#a99fbd;--accent:#a855f7;--accent-2:#7c3aed}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:440px;width:100%;text-align:center}
  .logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff;margin:0 auto 18px;box-shadow:0 10px 30px rgba(168,85,247,.35)}
  h1{font-size:24px;font-weight:800;letter-spacing:-.3px}
  p{color:var(--muted);margin:8px 0 26px;font-size:15px}
  a.doc{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:10px 0;font-weight:600;transition:.2s}
  a.doc:hover{border-color:var(--accent)}
  a.doc span.arrow{color:var(--accent)}
  footer{color:var(--muted);font-size:13px;margin-top:26px}
  footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">T</div>
    <h1>TALON AI</h1>
    <p>Legal documents · by Ailigent</p>
    <a class="doc" href="privacy.html"><span>Privacy Policy</span><span class="arrow">→</span></a>
    <a class="doc" href="terms.html"><span>Terms of Service</span><span class="arrow">→</span></a>
    <footer>© 2026 Ailigent · <a href="mailto:info@ailigent.ai">info@ailigent.ai</a></footer>
  </div>
</body>
</html>
